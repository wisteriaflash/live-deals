schema: spec-driven
context: |
  Personal Meituan live deal alert bot for Shanghai fast-food brands.
  Stack: Node.js 20+ + TypeScript lightweight service (not NestJS).
  v1: poll curated sources + manual inbox; WxPusher to owner.
  Next change add-live-browser-promo-polling: Playwright intercepts
  livestudiobaseinfo-style JSON, parses promo text, discount gate (≥¥3 or ≥10%).
  No official purchasable Meituan live-deal Open API for consumers.
artifacts:
  - id: proposal
    generates: proposal.md
  - id: specs
    generates: specs/**/*.md
  - id: design
    generates: design.md
  - id: tasks
    generates: tasks.md
